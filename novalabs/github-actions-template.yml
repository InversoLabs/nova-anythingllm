name: NOVA beta checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix novalabs
      - run: NODE_PATH="$PWD/novalabs/node_modules" npm test --prefix novalabs
      - run: npm run check --prefix novalabs
